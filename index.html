<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AML Training Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;
--bg:light-dark(#f4f5f7,#0e1216);--panel:light-dark(#ffffff,#151a20);--ink:light-dark(#151a20,#e5e8eb);--mute:light-dark(#5b6571,#94a0ac);
--line:light-dark(#d8dce1,#28313b);--soft:light-dark(#eef0f3,#1b222a);--pri:light-dark(#1f3a56,#8fb3d6);--prib:light-dark(#1f3a56,#2d5279);
--acc:light-dark(#8a2b2b,#e0938a);--ok:light-dark(#2d5b44,#86c4a2);--okb:light-dark(#e6efe9,#16261d);--bad:light-dark(#8a2b2b,#e0938a);--badb:light-dark(#f6e8e6,#2a1716);
--warn:light-dark(#7c5a12,#d9b46a);--warnb:light-dark(#f5eedd,#2a2213);--rail:#12171c;--railink:#c9d1d9}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans",system-ui,sans-serif;overflow:hidden}
h1,h2,h3{font-family:"IBM Plex Serif",Georgia,serif;font-weight:600;line-height:1.1;letter-spacing:-.01em;margin:0;text-wrap:balance}
h1{font-size:clamp(28px,3.4vw,40px)}h2{font-size:24px}h3{font-size:18px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);height:100%}
.side{background:var(--rail);color:var(--railink);display:flex;flex-direction:column;padding:22px 14px;gap:4px;border-right:1px solid #000}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px 18px;border-bottom:1px solid #2a323b;margin-bottom:12px}
.brand b{font-family:"IBM Plex Serif",serif;font-size:18px;color:#fff;font-weight:600;line-height:1.15}
.brand small{display:block;color:#8592a0;font-size:13px}
.nav{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 10px;border:0;background:none;border-radius:6px;text-align:left;color:var(--railink);font-size:15px}
.nav svg,.tab svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6}
.nav:hover{background:#1c232b}.nav[aria-current=page]{background:#223548;color:#fff}
.sidefoot{margin-top:auto;border-top:1px solid #2a323b;padding:14px 8px 0;font-size:13px;color:#8592a0}
.meter{height:4px;background:#2a323b;border-radius:2px;margin:6px 0 10px;overflow:hidden}.meter i{display:block;height:100%;background:#8fb3d6}
main{overflow-y:auto;height:100%;scroll-behavior:smooth}
.view{display:none;padding:clamp(20px,3.5vw,44px) max(4vw,16px) 64px;max-width:1240px;margin:0 auto}
.view.on{display:block}
.head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;padding-bottom:18px;border-bottom:2px solid var(--ink);margin-bottom:24px}
.head p{color:var(--mute);margin-top:8px;max-width:62ch}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px}
.panel>h3{margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.stack>*+*{margin-top:20px}
.lbl{font-size:13px;color:var(--mute)}
.big{font-family:"IBM Plex Serif",serif;font-size:clamp(26px,3vw,34px);font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:6px;border:1px solid var(--prib);background:var(--prib);color:#fff;font-weight:500}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;color:var(--pri);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--pri)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:3px 10px;border:1px solid var(--line);border-radius:999px;white-space:nowrap;color:var(--mute)}
.chip.alert{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 45%,transparent)}
.chip.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.nw{white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:500;color:var(--mute);text-align:left;border-bottom:1px solid var(--ink);padding:8px 8px}
td{border-bottom:1px solid var(--line);padding:8px 8px;vertical-align:top}
.scroll{overflow-x:auto}
.tall{max-height:380px;overflow:auto}
.tall thead th{position:sticky;top:0;background:var(--panel)}
tr.hit td{background:color-mix(in srgb,var(--acc) 8%,transparent)}
/* lifecycle picture */
.life{position:relative;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));margin:6px 0 4px}
.life:before{content:"";position:absolute;left:8%;right:8%;top:23px;height:2px;background:var(--ink)}
.stn{position:relative;text-align:center;padding:0 6px}
.dot{width:48px;height:48px;margin:0 auto 12px;border-radius:50%;border:2px solid var(--ink);background:var(--panel);display:grid;place-items:center}
.dot svg{width:22px;height:22px;stroke:var(--pri);fill:none;stroke-width:1.7}
.stn.hot .dot{border-color:var(--acc)}.stn.hot .dot svg{stroke:var(--acc)}
.stn b{display:block;font-family:"IBM Plex Serif",serif;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.stn span{display:block;font-size:13px;color:var(--mute);margin-top:4px}
/* day track */
.days{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.day{padding:16px;border-left:1px solid var(--line);border-bottom:1px solid var(--line)!important;display:flex;flex-direction:column;gap:8px;text-align:left;background:none;border-top:0;border-right:0;border-bottom:0}
.day:nth-child(4n+1){border-left:0}.day:nth-last-child(-n+4){border-bottom:0!important}
.day:hover{background:var(--soft)}
.day .lbl{display:flex;justify-content:space-between}
.ticks{display:flex;gap:4px;margin-top:auto}.ticks i{flex:1;height:4px;border-radius:2px;background:var(--line)}.ticks i.y{background:var(--pri)}
/* learn */
.learn{display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;align-items:start}
.toc{position:sticky;top:0;display:flex;flex-direction:column;gap:2px}
.toc h4{margin:14px 0 4px;font-size:13px;font-weight:500;color:var(--mute)}
.toc button{display:flex;gap:10px;align-items:flex-start;text-align:left;border:0;background:none;padding:9px 10px;border-radius:6px;min-height:44px;font-size:14px;line-height:1.35}
.toc button:hover{background:var(--soft)}
.toc button[aria-current=true]{background:var(--panel);box-shadow:inset 3px 0 0 var(--pri)}
.toc .id{font-variant-numeric:tabular-nums;color:var(--mute);width:2.2em;flex:none}
.toc .tk{margin-left:auto;flex:none;color:var(--ok)}
.lesson h2{font-size:clamp(24px,2.6vw,32px);margin:6px 0 10px}
.points{list-style:none;margin:20px 0 0;padding:0;counter-reset:p}
.points li{counter-increment:p;display:grid;grid-template-columns:36px minmax(0,1fr);gap:8px;padding:12px 0;border-top:1px solid var(--line);max-width:72ch}
.points li:before{content:counter(p);font-family:"IBM Plex Serif",serif;color:var(--pri);font-weight:600}
.note{border-left:3px solid var(--pri);background:var(--panel);padding:14px 16px;border-radius:0 6px 6px 0;max-width:76ch}
.note.off{border-left-color:var(--acc)}
.note b{display:block;font-size:13px;color:var(--mute);font-weight:500;margin-bottom:4px}
/* multiple choice */
.mc{border:1px solid var(--line);border-radius:8px;padding:18px;background:var(--panel)}
.mc .q{font-weight:500;margin-bottom:12px;max-width:72ch}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:10px 12px;min-height:44px;line-height:1.4}
.opt:hover:not(:disabled){border-color:var(--pri)}
.opt .k{width:24px;height:24px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;font-size:12px;color:var(--mute)}
.opt.right{border-color:var(--ok);background:var(--okb)}.opt.right .k{border-color:var(--ok);color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--badb)}.opt.wrong .k{border-color:var(--bad);color:var(--bad)}
.opt.part{border-color:var(--warn);background:var(--warnb)}
.opt:disabled{cursor:default}
.exp{margin-top:12px;font-size:15px;padding:10px 12px;border-radius:6px;background:var(--soft)}
.exp b{color:var(--ok)}.exp b.no{color:var(--bad)}
/* lab */
.lab{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start}
.rules{display:grid;gap:12px}
.rule{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:14px 16px}
.rule.offr{opacity:.55}
.rule header{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.rule p{font-size:14px;color:var(--mute);margin-top:2px}
.sw{position:relative;width:44px;height:26px;flex:none;appearance:none;border-radius:13px;background:var(--line);border:0;transition:background .15s}
.sw:before{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.sw:checked{background:var(--prib)}.sw:checked:before{left:21px}
.prm{display:grid;grid-template-columns:minmax(0,1fr) 88px;gap:4px 12px;align-items:center;margin-top:10px;font-size:14px}
.prm output{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
input[type=range]{grid-column:1/-1;width:100%;appearance:none;height:28px;background:none}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--line)}
input[type=range]::-moz-range-track{height:2px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{appearance:none;width:18px;height:18px;border-radius:50%;background:var(--panel);border:2px solid var(--pri);margin-top:-8px}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--panel);border:2px solid var(--pri)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kpis>div{background:var(--panel);padding:14px 16px}
.bars{display:grid;gap:12px;margin-top:6px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:14px}
.track{grid-column:1/-1;display:flex;height:10px;background:var(--soft);border-radius:2px;overflow:hidden}
.track i{display:block;height:100%}.track .tp{background:var(--acc)}.track .fp{background:color-mix(in srgb,var(--mute) 55%,transparent)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--mute);margin-top:12px}.legend i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px}
.sticky{position:sticky;top:0}
/* cases */
.cases{display:grid;grid-template-columns:320px minmax(0,1fr);gap:24px;align-items:start}
.queue{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden}
.qi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 14px;min-height:44px}
.qi:last-child{border-bottom:0}.qi:hover{background:var(--soft)}
.qi[aria-current=true]{box-shadow:inset 3px 0 0 var(--pri);background:var(--soft)}
.qi b{font-weight:500}.qi small{grid-column:1/-1;color:var(--mute);font-size:13px}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 16px;font-size:14px}
.kv dt{color:var(--mute)}.kv dd{margin:0}
.fig{position:relative;height:220px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
svg text{font:12px "IBM Plex Sans",sans-serif;fill:var(--mute)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:0 12px;min-height:36px;font-size:14px;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}.seg button[aria-pressed=true]{background:var(--prib);color:#fff}
.field{display:grid;gap:4px;font-size:14px}
.field input,.field textarea{border:1px solid var(--line);border-radius:6px;padding:9px 11px;background:var(--panel);font-size:16px}
.field textarea{min-height:64px;resize:vertical}
.draft{white-space:pre-wrap;font-size:15px;background:var(--soft);border-radius:6px;padding:14px;max-width:80ch}
.stamp{display:inline-block;border:2px solid currentColor;padding:2px 10px;font-weight:600;letter-spacing:.02em;border-radius:4px;transform:rotate(-2deg)}
.score{font-family:"IBM Plex Serif",serif;font-size:56px;font-weight:600;line-height:1}
.empty{color:var(--mute);padding:28px;text-align:center;border:1px dashed var(--line);border-radius:8px}
.gl{display:grid;grid-template-columns:200px minmax(0,1fr);gap:0 20px}
.gl dt{font-weight:500;padding:10px 0;border-top:1px solid var(--line)}.gl dd{margin:0;padding:10px 0;border-top:1px solid var(--line);color:var(--mute)}
.search{width:100%;max-width:420px;border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--panel);font-size:16px}
a{color:var(--pri)}
.sec{margin-top:32px}.sec>h3{margin-bottom:12px}
.prose{max-width:72ch;margin-bottom:12px}
.jump{display:flex;gap:6px;margin:4px 0 8px;padding-bottom:4px}
.jump a{flex:none;font-size:14px;color:var(--pri);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--panel)}
.jump a:hover{border-color:var(--pri)}
.ticks2,.cross,.take ul{list-style:none;margin:0;padding:0;max-width:76ch}
.ticks2 li,.cross li,.take li{position:relative;padding:8px 0 8px 26px;border-top:1px solid var(--line)}
.ticks2 li:first-child,.cross li:first-child,.take li:first-child{border-top:0}
.ticks2 li:before{content:"";position:absolute;left:4px;top:17px;width:8px;height:8px;border:2px solid var(--pri);border-radius:50%}
.cross li:before{content:"";position:absolute;left:4px;top:19px;width:12px;height:2px;background:var(--acc)}
.steps{margin:0;padding-left:22px;max-width:76ch}.steps li{padding:6px 0 6px 6px}
.take{border:2px solid var(--pri);border-radius:8px;padding:18px 20px;background:var(--panel)}
.take li:before{content:"\2713";position:absolute;left:2px;top:7px;color:var(--pri);font-weight:600}
.lesson .gl{grid-template-columns:180px minmax(0,1fr)}
@media(max-width:700px){.lesson .gl{grid-template-columns:minmax(0,1fr)}}
.tabbar{display:none}
.sample{font-size:13px;color:var(--mute)}
@media(max-width:1100px){.lab,.cases{grid-template-columns:minmax(0,1fr)}.sticky{position:static}.learn{grid-template-columns:240px minmax(0,1fr)}}
@media(max-width:900px){
 .app{grid-template-columns:minmax(0,1fr)}
 .side{display:none}
 main{padding-bottom:72px}
 .tabbar{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;height:64px;background:var(--rail);border-top:1px solid #000;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
 .tab{border:0;background:none;color:#8a96a3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px}
 .tab[aria-current=page]{color:#fff}
 .learn{grid-template-columns:minmax(0,1fr)}.toc{position:static}
 .grid3{grid-template-columns:minmax(0,1fr)}
}
@media(max-width:1100px){.days{grid-template-columns:repeat(2,minmax(0,1fr))}.day:nth-child(n){border-left:1px solid var(--line);border-bottom:1px solid var(--line)!important}.day:nth-child(2n+1){border-left:0}.day:nth-last-child(-n+2){border-bottom:0!important}}
@media(max-width:700px){
 .grid2{grid-template-columns:minmax(0,1fr)}
 .days{grid-template-columns:minmax(0,1fr)}.day:nth-child(n){border-left:0;border-bottom:1px solid var(--line)!important}.day:last-child{border-bottom:0!important}
 .life{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:22px}.life:before{display:none}
 .gl{grid-template-columns:minmax(0,1fr)}.gl dd{border-top:0;padding-top:0}
 table{font-size:13px}th,td{padding:6px 4px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
<aside class="side" aria-label="Main navigation">
 <div class="brand"><svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="#8fb3d6" stroke-width="1.6"><rect x="3" y="5" width="24" height="20" rx="2"/><path d="M3 11h24M9 17h6M9 20h10"/><circle cx="21.5" cy="18.5" r="2.5" stroke="#e0938a"/></svg><div><b>AML Training Lab</b><small>Transaction monitoring</small></div></div>
 <div id="navs"></div>
</aside>
<main id="main">
 <section class="view" id="v-home"></section>
 <section class="view" id="v-learn"></section>
 <section class="view" id="v-lab"></section>
 <section class="view" id="v-cases"></section>
 <section class="view" id="v-tests"></section>
 <section class="view" id="v-ref"></section>
</main>
<nav class="tabbar" id="tabs" aria-label="Main navigation"></nav>
</div>
<script>
/* ===== Curriculum: independent topic modules, built on FFIEC, FinCEN, OFAC and FATF material ===== */
const MODS=[
 {n:1,t:"How money laundering works",d:"The three stages, predicate crime, terrorist financing and why banks are gatekeepers"},
 {n:2,t:"The US legal framework",d:"The BSA, who enforces it, required reports and records, and what changed recently"},
 {n:3,t:"Knowing your customer",d:"Identification, beneficial ownership, risk rating and enhanced due diligence"},
 {n:4,t:"Sanctions and screening",d:"OFAC, the 50 Percent Rule, PEPs, adverse media and country risk"},
 {n:5,t:"Inside a monitoring system",d:"Data, scenarios, thresholds, tuning and how alerts reach an analyst"},
 {n:6,t:"Typologies and red flags",d:"Cash, movement, third-party, trade, fraud and virtual asset patterns"},
 {n:7,t:"Investigating an alert",d:"Triage, analysis, evidence, customer outreach and the SAR decision"},
 {n:8,t:"Analyst toolkit",d:"Spreadsheet techniques and open-source research for case work"}
];
const LESSONS=[
/* ---- Module 1 ---- */
{id:"m1a",mod:1,t:"Three stages, one goal",
 p:["Laundering exists to give criminal money a believable history, so it can be spent or invested without drawing attention to where it came from.",
 "Placement is the riskiest moment for a criminal: physical cash, or funds from an obvious crime, first touch a regulated institution. Deposits, money orders and cash-heavy front businesses are common entry points.",
 "Layering puts distance between the money and its source: transfers between accounts, institutions, countries and asset types, often fast and with little business logic.",
 "Integration returns the money looking legitimate: property purchases, loans repaid from ‘business profits’, invoices for services never delivered.",
 "Real schemes rarely run in a neat line. A single account can show placement and layering in the same week, so analysts look for behaviour rather than labels."],
 ex:"A drug courier deposits small sums of cash into several accounts (placement). The funds are wired to a shell company abroad and back as a ‘consulting fee’ (layering). The fee pays the mortgage on a rental property (integration)."},
{id:"m1b",mod:1,t:"Where dirty money comes from",
 p:["Laundering needs an underlying crime, called a predicate offence: fraud, drug trafficking, corruption, tax crimes, human trafficking, cybercrime and many others.",
 "In the US, fraud is the largest source of illicit proceeds, which is why scams and account takeovers now drive so much alert volume.",
 "Analysts are not expected to prove which crime produced the money. The task is to recognise when activity has no reasonable explanation and report it.",
 "Knowing the predicate still helps: it shapes which red flags to look for and the vocabulary used in a SAR."],
 off:"FinCEN’s first national AML/CFT priorities (30 June 2021) are corruption, cybercrime, terrorist financing, fraud, transnational criminal organisations, drug trafficking, human trafficking and smuggling, and proliferation financing. Programs are expected to reflect them in their risk assessments."},
{id:"m1c",mod:1,t:"Terrorist financing is laundering in reverse",
 p:["Money laundering hides where money came from. Terrorist financing hides where money is going.",
 "The source can be completely clean: wages, savings, donations or a small business. What matters is the destination and purpose.",
 "Amounts are often small and unremarkable on their own. The pattern only shows when you aggregate transfers, beneficiaries and timing.",
 "Watch for funds pooled from many people and sent onward to a conflict area, charities whose spending does not match their stated mission, and sudden changes in travel or transfer behaviour.",
 "Nationality, religion, ethnicity or charitable giving are never indicators on their own. Assessments must rest on behaviour."]},
{id:"m1d",mod:1,t:"Why banks are the gatekeepers",
 p:["Almost every laundering method eventually needs a bank account, a payment rail or a card. That makes financial institutions the most practical place to spot it.",
 "Banks manage this through the three lines of defence: the business that owns customer risk, compliance and risk functions that oversee it, and internal audit that tests both.",
 "A monitoring analyst sits in the second line (or in a first-line operations team supporting it) and turns automated signals into human judgement.",
 "Failures are costly. Regulators can impose penalties, growth restrictions or monitorships, and individuals can face personal liability for wilful violations."]},
/* ---- Module 2 ---- */
{id:"m2a",mod:2,t:"The Bank Secrecy Act at a glance",
 p:["The BSA (1970) requires financial institutions to keep records and file reports that are useful to law enforcement. It sits in 31 U.S.C. Chapter 53, with FinCEN’s rules in 31 CFR Chapter X.",
 "Later laws built on it: the Money Laundering Control Act 1986 made laundering a federal crime; the USA PATRIOT Act 2001 added customer identification and stronger due diligence; the AML Act of 2020 modernised the regime and created national priorities.",
 "Every bank must run an AML/CFT program with internal controls, independent testing, a designated BSA officer, training, and risk-based customer due diligence.",
 "Supervision is shared: FinCEN writes the rules; the OCC, Federal Reserve, FDIC and NCUA examine banks and credit unions; the SEC and FINRA cover securities firms; the DOJ prosecutes."],
 off:"On 7 April 2026 FinCEN proposed a rule to reform AML/CFT programs around an ‘effective’ standard that lets institutions put resources on higher risks. Comments closed 9 June 2026; a final rule would take effect 12 months after issuance. Check FinCEN for its current status."},
{id:"m2b",mod:2,t:"Reports and records you will see",
 p:["Currency Transaction Report (CTR): cash in or out over $10,000 in a business day, aggregated across transactions by or for the same person. Filed within 15 days. It is routine, not an accusation.",
 "Suspicious Activity Report (SAR): filed when a bank knows, suspects or has reason to suspect a transaction involves illicit funds, evades the BSA or has no apparent lawful purpose, generally at $5,000 or more where a suspect is identified.",
 "Recordkeeping: funds transfers of $3,000 or more carry originator and beneficiary details, and cash purchases of monetary instruments from $3,000 to $10,000 require identification and a log. Records are kept for five years.",
 "Structuring, splitting cash to dodge a CTR, is a crime in itself under 31 U.S.C. § 5324, even if the money is clean.",
 "SARs are confidential. Disclosing that one exists or is being considered (tipping off) is prohibited, and good-faith filers have safe harbor from civil liability."],
 off:"FinCEN SAR FAQs (October 2025): an initial SAR is generally due 30 days after the facts are detected, extendable to 60 if no suspect is identified. Cash near $10,000 alone does not require a SAR, a post-SAR continuing activity review is not mandatory, and documenting a decision not to file is encouraged but not required."},
{id:"m2c",mod:2,t:"Information sharing: 314(a) and 314(b)",
 p:["Section 314(a) lets FinCEN send banks lists of subjects named by law enforcement. Banks search their records and report matches, quietly and quickly.",
 "Section 314(b) lets registered institutions share information with each other about possible laundering or terrorist financing, with legal protection.",
 "For an analyst, 314(b) can fill gaps: confirming whether a counterparty bank sees the same pattern on its side.",
 "A 314(a) match is not proof of anything, but it should trigger a review of the customer’s activity under your procedures."]},
/* ---- Module 3 ---- */
{id:"m3a",mod:3,t:"Identifying the customer",
 p:["Customer identification sets the foundation: the bank must form a reasonable belief that it knows who it is dealing with.",
 "For individuals, the minimum is name, date of birth, a residential address and an identification number, verified by documents or independent data sources.",
 "For businesses, verify the legal name, physical address and tax ID, then go further: who owns it and who controls it are separate questions from whether it exists.",
 "Names are screened against government lists at onboarding, and discrepancies (a date of birth that does not match, an address that is a mail drop) must be resolved, not noted and forgotten."]},
{id:"m3b",mod:3,t:"Beneficial ownership",
 p:["A beneficial owner is a real person behind a legal entity: each individual owning 25% or more, plus one individual with significant management control.",
 "Layered structures, nominee directors and offshore holding companies are not illegal, but they deserve a clear business rationale.",
 "Ownership changes, especially shortly before large or unusual activity, are worth noting in a case.",
 "If a public registry shows no owner, that is a gap to close, not evidence that nobody owns the company."],
 off:"FinCEN’s exceptive relief order of 13 February 2026 lets banks identify and verify a legal entity’s beneficial owners at first account opening, when facts cast doubt on earlier information, and as their risk-based procedures require, rather than at every new account. Use is optional and the ownership requirement remains."},
{id:"m3c",mod:3,t:"Risk rating and expected activity",
 p:["Every customer gets a risk profile built from who they are, where they operate, which products they use and how they transact.",
 "The profile should say what normal looks like: typical income or revenue, transaction types, counterparties and geographies. Monitoring compares actual activity against this.",
 "A vague profile (‘general business’, ‘personal use’) makes every later alert harder to resolve. Good profiles are specific and current.",
 "Ratings are reviewed periodically, and also when something changes: a new product, a move to a new country, adverse news, or repeated alerts."],
 ex:"Two accounts each receive a $60,000 wire from overseas. For an import business with declared foreign suppliers, it fits. For a newly opened personal account belonging to a student, it calls for questions."},
{id:"m3d",mod:3,t:"Enhanced due diligence",
 p:["EDD is extra scrutiny for higher-risk relationships: politically exposed persons, cash-intensive businesses, money services businesses, private and correspondent banking, complex ownership and high-risk jurisdictions.",
 "Typical measures include documented source of funds (where this money came from) and source of wealth (how the person built their overall wealth), senior management approval, site visits and more frequent reviews.",
 "EDD is proportionate, not punitive. The aim is to understand the risk well enough to manage it, and most high-risk customers are legitimate.",
 "An analyst who finds activity well outside the profile may recommend an EDD review even when a SAR is not warranted."]},
/* ---- Module 4 ---- */
{id:"m4a",mod:4,t:"OFAC sanctions",
 p:["OFAC administers US economic sanctions. US persons must not deal with property or interests of designated parties, wherever the transaction happens.",
 "The SDN List names blocked individuals, companies, vessels and aircraft. Other programmes impose narrower restrictions, such as limits on debt or equity dealings.",
 "Blocking freezes the property and must be reported to OFAC within 10 business days. Some prohibited transactions are rejected instead of blocked.",
 "Sanctions liability is strict: intent is not required. That is why screening runs in real time on payments and customer records.",
 "The 50 Percent Rule: an entity owned 50% or more, directly or indirectly and in aggregate, by blocked persons is itself blocked, even if it is not on the list."],
 ex:"Two blocked individuals each own 30% of a shipping company. Neither alone controls it, but together they own 60%, so the company is treated as blocked."},
{id:"m4b",mod:4,t:"Resolving a screening hit",
 p:["Most hits are false: common names, partial matches or outdated aliases. Each needs a documented resolution.",
 "Compare identifiers: full name and spelling, date of birth, nationality, address, ID numbers, and for entities, registration details and owners.",
 "Look at context: does the profession, location or business line fit the listed party? One strong mismatch (a different date of birth) usually resolves an individual hit.",
 "If the hit cannot be ruled out, escalate under your procedure and do not release the payment while it is under review. Never ask the customer whether they are the sanctioned person."]},
{id:"m4c",mod:4,t:"PEPs and adverse media",
 p:["Politically exposed persons hold or held prominent public functions, such as senior officials, judges, military leaders and executives of state-owned companies, plus their family and close associates.",
 "PEP status raises corruption risk; it does not make someone a criminal. Expect proportionate EDD, not automatic exit.",
 "Adverse media must be weighed for source quality, date and status. An allegation, a charge, a conviction and an acquittal are very different facts.",
 "Prefer court records, regulators’ announcements and established news outlets. Treat anonymous posts and blogs as leads to verify, never as evidence."],
 off:"FinCEN’s Advisory on Kleptocracy and Foreign Public Corruption (April 2022) lists red flags for corrupt PEP activity and asks filers to use the key term CORRUPTION FIN-2022-A001 in SARs."},
{id:"m4d",mod:4,t:"Country and geographic risk",
 p:["Geography raises or lowers risk; it never decides a case alone. A payment to a high-risk country with clear trade documents can be routine.",
 "Sources of country risk include the FATF lists, OFAC programmes, the institution’s own country risk ratings, and corruption and secrecy indicators.",
 "The FATF publishes two lists: jurisdictions subject to a call for action (EDD and possibly countermeasures), and jurisdictions under increased monitoring (the ‘grey list’), which are working to fix deficiencies.",
 "Watch for routing that makes no sense: funds passing through several countries with no link to the customer, or a sudden new corridor."],
 off:"After the FATF plenary on 30 October 2026, the DPRK, Iran and Myanmar remain subject to a call for action, and Bulgaria, Côte d’Ivoire, the Democratic Republic of the Congo and Monaco left the grey list. The lists change three times a year, so check the current version."},
/* ---- Module 5 ---- */
{id:"m5a",mod:5,t:"From raw data to an alert",
 p:["A monitoring system takes customer data (KYC, risk rating, segment) and transaction data (amount, date, channel, counterparty, country), then runs detection logic over a lookback period.",
 "Data quality decides everything downstream. A missing country code, a mislabelled transaction type or an unmapped product can silently stop a scenario from working.",
 "Most banks combine rule-based scenarios (clear thresholds) with behavioural models that compare a customer with their own history or peer group.",
 "Alerts are often grouped by customer into cases so one analyst sees the full picture rather than fragments."]},
{id:"m5b",mod:5,t:"Scenarios, thresholds and segments",
 p:["A scenario is logic aimed at one typology: structuring, rapid movement, high-risk geography, many senders, dormant reactivation, profile deviation.",
 "Parameters set its sensitivity: an amount, a count, a time window, a percentage. Each one trades coverage against noise.",
 "Segmentation applies different thresholds to different customer groups. $50,000 a month is unremarkable for a distributor and alarming for a student.",
 "No scenario catches everything. Coverage comes from overlapping scenarios, so a gap in one is covered by another."]},
{id:"m5c",mod:5,t:"Tuning and model governance",
 p:["Tuning adjusts thresholds using evidence. Above-the-line testing checks what current alerts produce; below-the-line testing samples activity just under the threshold to see what would be missed.",
 "Two numbers frame the trade-off: precision (how many alerts are productive) and coverage or detection (how much suspicious activity is caught). Raising thresholds improves the first and can hurt the second.",
 "Monitoring systems are models, so model risk management applies: documented design, independent validation, ongoing performance review and change control.",
 "Analyst feedback matters. Recurring false positives with the same explanation are evidence for tuning or segmentation, and they should be recorded consistently."],
 ex:"Lowering a structuring scenario’s floor from $8,000 to $3,000 may catch smurfing deposits of $3,000–$4,800, but it will also flag many ordinary business deposits. Below-the-line testing shows whether the extra alerts are worth it."},
{id:"m5d",mod:5,t:"Alert lifecycle and quality",
 p:["Typical flow: alert generated → triage (quick check for obvious explanation or duplication) → investigation → disposition → quality assurance → SAR decision where needed.",
 "Each step has a service level. Ageing alerts are a regulatory concern because they delay SAR filing deadlines.",
 "Quality assurance samples closed and escalated work for accuracy, evidence and narrative quality. Findings feed back into training.",
 "Good productivity is consistent, well-evidenced decisions, not the largest number of closures."]},
/* ---- Module 6 ---- */
{id:"m6a",mod:6,t:"Cash patterns",
 p:["Structuring: one person splits cash into amounts under $10,000, often across days or branches. Intent to evade is the offence.",
 "Smurfing: several people make the deposits, sometimes into one account, each well below any threshold.",
 "Funnel accounts: cash deposited in one region and withdrawn quickly in another, often linked to drug or smuggling proceeds moving back to source.",
 "Commingling: illicit cash mixed into a genuine cash-intensive business, showing up as revenue that is too high, too steady or out of line with the business’s size and card mix."]},
{id:"m6b",mod:6,t:"Movement patterns",
 p:["Pass-through or rapid movement: funds arrive and leave within days with little retained, often to new beneficiaries or other countries.",
 "Shell company activity: newly formed entities with no payroll, rent or suppliers, whose accounts only move round sums between other companies.",
 "Round-tripping: money leaves and returns disguised as investment or loans, creating apparently legitimate income.",
 "Dormant reactivation: a quiet account suddenly handles large values, a common sign of an account sold or recruited for laundering."]},
{id:"m6c",mod:6,t:"Third parties and money mules",
 p:["A money mule receives and passes on funds for others, knowingly or not. Students, job seekers and romance-scam victims are common recruits.",
 "Signs: many unrelated senders, values inconsistent with the customer’s income, rapid cash withdrawals or onward transfers, and new P2P or crypto activity.",
 "Mule accounts are the plumbing for fraud. Many victims of scams later become unwitting mules themselves.",
 "Unwitting mules may be victims as well as subjects. The narrative records facts and leaves intent to investigators."],
 off:"FinCEN’s September 2023 alert on ‘pig butchering’ virtual currency investment scams describes fake online relationships that lead victims into bogus crypto platforms; SARs should use the key term FIN-2023-PIGBUTCHERING."},
{id:"m6d",mod:6,t:"Trade-based laundering",
 p:["TBML disguises value transfer as trade: over- or under-invoicing, multiple invoicing for one shipment, phantom shipments and goods that do not match the business.",
 "Analysts rarely see the goods, but can see the payments: round amounts, payments to unrelated third parties, routes through high-risk jurisdictions, and payment descriptions that conflict with the business.",
 "Ask whether the counterparty, product and price make commercial sense for this customer.",
 "Request invoices, bills of lading or contracts where procedures allow, and check that names and amounts reconcile."]},
{id:"m6e",mod:6,t:"Fraud-linked patterns",
 p:["Elder financial exploitation: sudden large withdrawals, new ‘friends’ or caregivers directing transactions, wires to unknown parties, and confusion about recent activity.",
 "Business email compromise: urgent payment changes to new beneficiary accounts, often abroad, followed by quick onward transfers.",
 "Check fraud: altered or counterfeit checks deposited to new accounts, then funds withdrawn before the check returns.",
 "Victims need protection as well as reporting. Many banks can delay a transaction or contact a trusted person, under their policies."],
 off:"FinCEN’s Advisory on Elder Financial Exploitation (June 2022) defines it as the illegal or improper use of an older adult’s funds, property or assets, and asks SAR filers to use the key term EFE FIN-2022-A002. Its February 2023 alert covers mail theft-related check fraud."},
{id:"m6f",mod:6,t:"Virtual assets",
 p:["Banks see crypto through its edges: transfers to and from exchanges, crypto ATMs (kiosks) and peer-to-peer sellers.",
 "Red flags include rapid conversion of fiat to crypto and back, exchanges in high-risk jurisdictions, use of mixers or privacy coins reported by the customer’s own disclosures, and customers coached by a third party.",
 "Many crypto alerts are scam victims, not launderers. Note who is directing the activity.",
 "Customer due diligence still applies: a sudden pivot to large crypto purchases should match income and stated purpose."]},
/* ---- Module 7 ---- */
{id:"m7a",mod:7,t:"Triage: the first ten minutes",
 p:["Read the alert first: which scenario, which transactions, what period, and what parameter was breached. The scenario tells you what risk you are testing.",
 "Check history: prior alerts, prior SARs, open cases, and any recent KYC refresh or customer contact.",
 "Look for an obvious explanation that the file already documents. If one exists and is supported, record it and close.",
 "If not, scope the investigation: which accounts, which related parties, how far back."]},
{id:"m7b",mod:7,t:"Analysing the activity",
 p:["Compare actual with expected across value, volume, frequency, direction, counterparties, channels, geography and timing.",
 "Follow the money both ways: where it came from and where it went, as far as your records allow.",
 "Quantify the change: “credits were 4.2 times the stated monthly income” is stronger than “activity increased significantly”.",
 "Look beyond the trigger. The alerting transactions may be the least interesting part of the account."]},
{id:"m7c",mod:7,t:"Evidence and customer outreach",
 p:["Separate facts (in the records), observations (patterns you found), unverified claims and assumptions. Only facts and reasoned findings belong in conclusions.",
 "Internal evidence: KYC, statements, wire details, check images, prior cases. External: registries, court records, reputable news, enforcement releases.",
 "A request for information (RFI) to the customer can resolve gaps, but must be neutral and routine in tone so nothing hints at a SAR.",
 "A customer explanation is information to test against the records, not proof. Note whether documents were provided and whether they reconcile."]},
{id:"m7d",mod:7,t:"Deciding and writing it up",
 p:["Dispositions are usually: close with rationale, further investigation (RFI, EDD, account review), or escalate for SAR consideration. Who decides to file depends on your institution’s governance.",
 "A SAR narrative should answer who, what, when, where and why, and describe how the activity was carried out, in chronological order with amounts and dates.",
 "Write for a reader who has never seen the account: plain language, no internal jargon, no speculation about guilt.",
 "Closing notes deserve the same discipline. Someone may review the decision years later."],
 ex:"Weak: “Customer is clearly a mule.” Strong: “Between Sep 20 and Sep 29 the account received 16 P2P transfers totalling $9,840 from senders with no apparent link to the customer; $4,000 was withdrawn in cash and $5,800 wired to Ostravia by Oct 1.”"},
/* ---- Module 8 ---- */
{id:"m8a",mod:8,t:"Spreadsheet skills for case work",
 p:["Load a transaction export into an Excel Table so formulas and filters expand as rows are added.",
 "PivotTables answer most case questions fast: totals by counterparty, by month, by channel or by branch.",
 "SUMIFS and COUNTIFS count and total with conditions, such as cash deposits between $8,000 and $9,999. XLOOKUP pulls KYC fields into a transaction list.",
 "Absolute references ($A$1) keep a formula pointing at a fixed cell when copied, which is useful for thresholds.",
 "Check for duplicates and numbers stored as text before trusting totals, and always work on a copy of the original export."]},
{id:"m8b",mod:8,t:"Open-source research",
 p:["Start with official sources: state business registries, court records, regulator and DOJ announcements, OFAC search.",
 "Use search operators to cut noise: exact phrases in quotes, a name plus terms such as fraud, indicted or sanctions, and a site filter for official domains.",
 "Record what you searched, when, and what you found, including null results. Another analyst should be able to repeat it.",
 "Assess every result for reliability, relevance and date before it goes into a case. Never contact the subject or create accounts to view their profiles."]}
];

/* question bank: l = lesson id, a = index of correct option */
const QB=[
{l:"m1a",q:"Which stage of laundering is usually the riskiest for a criminal?",o:["Integration","Placement","Layering","Reporting"],a:1,e:"Placement is when illicit funds, often cash, first enter a regulated institution and are most exposed to detection."},
{l:"m1a",q:"Funds are wired through three countries and two shell companies in a week. Which stage does this best illustrate?",o:["Placement","Layering","Integration","Collection"],a:1,e:"Layering creates distance between the money and its source."},
{l:"m1a",q:"Laundered funds are used to buy a rental property. Which stage is this?",o:["Placement","Layering","Integration","Structuring"],a:2,e:"Integration returns the money to the economy looking legitimate."},
{l:"m1b",q:"What is a predicate offence?",o:["A report filed with FinCEN","The underlying crime that generated the illicit funds","A type of sanctions list","A monitoring scenario"],a:1,e:"Laundering requires an underlying crime such as fraud, corruption or drug trafficking."},
{l:"m1b",q:"Which is one of FinCEN’s national AML/CFT priorities?",o:["Late tax filing","Fraud","Overdraft fees","Credit scoring"],a:1,e:"The eight priorities include corruption, cybercrime, terrorist financing, fraud, criminal organisations, drug trafficking, human trafficking and proliferation financing."},
{l:"m1b",q:"Must an analyst prove which crime produced the funds before escalating?",o:["Yes, always","No; the task is to recognise activity with no reasonable explanation and report it","Only for cash","Only if the customer admits it"],a:1,e:"Proving the predicate is for law enforcement."},
{l:"m1c",q:"What is the key difference between terrorist financing and money laundering?",o:["TF only uses crypto","TF hides where money is going and can use clean funds","TF always involves large sums","There is no difference"],a:1,e:"Laundering conceals origin; terrorist financing conceals destination and purpose."},
{l:"m1c",q:"Which of these can never be an indicator of terrorist financing on its own?",o:["Funds pooled from many people and sent to a conflict area","A charity whose spending does not match its mission","The customer’s religion","Sudden unexplained transfers to new beneficiaries abroad"],a:2,e:"Assessments rest on behaviour, never on religion, nationality or ethnicity."},
{l:"m1d",q:"In the three lines of defence model, who provides independent testing?",o:["The business line","Compliance","Internal audit","The customer"],a:2,e:"Audit is the third line and tests both the business and compliance."},
{l:"m1d",q:"Why are banks considered gatekeepers?",o:["They set criminal law","Almost every laundering method eventually needs an account or payment rail","They prosecute offenders","They issue sanctions"],a:1,e:"Access to the financial system is where laundering can be spotted."},
{l:"m2a",q:"Which agency writes the BSA regulations?",o:["OCC","FinCEN","OFAC","FINRA"],a:1,e:"FinCEN administers the BSA; its rules are in 31 CFR Chapter X."},
{l:"m2a",q:"Which law made money laundering a federal crime?",o:["Bank Secrecy Act 1970","Money Laundering Control Act 1986","USA PATRIOT Act 2001","AML Act of 2020"],a:1,e:"The BSA created reporting; the 1986 Act criminalised laundering."},
{l:"m2a",q:"Which is a required element of a bank AML/CFT program?",o:["A marketing plan","A designated BSA officer","A crypto trading desk","Annual customer surveys"],a:1,e:"Programs include internal controls, independent testing, a BSA officer, training and customer due diligence."},
{l:"m2b",q:"Three cash deposits of $4,000, $3,500 and $3,000 are made by one customer on the same business day. What applies?",o:["Nothing, each is under $10,000","Aggregated, they exceed $10,000 and may require a CTR","A SAR is automatically required","A 314(a) report"],a:1,e:"CTR aggregation combines same-day cash transactions by or for the same person."},
{l:"m2b",q:"A customer splits cash deposits to avoid a CTR, but the money is from a legitimate business. Is this lawful?",o:["Yes, the money is clean","No, structuring is a crime regardless of the source","Only if under $5,000","Only if done at one branch"],a:1,e:"31 U.S.C. § 5324 prohibits structuring itself."},
{l:"m2b",q:"For how long must BSA records generally be kept?",o:["One year","Three years","Five years","Indefinitely"],a:2,e:"The general BSA retention period is five years."},
{l:"m2b",q:"Under FinCEN’s October 2025 SAR FAQs, when is an initial SAR generally due?",o:["Within 15 days of the transaction","30 days after detecting facts that may require filing, up to 60 if no suspect is identified","90 days after the alert","Only when law enforcement asks"],a:1,e:"Reporting may not be delayed more than 60 days after detection."},
{l:"m2b",q:"A colleague tells a customer their account is under SAR review. What is this?",o:["Good customer service","Tipping off, which is prohibited","An RFI","A 314(b) request"],a:1,e:"SAR confidentiality forbids disclosing that a SAR exists or is being considered."},
{l:"m2c",q:"What does Section 314(b) allow?",o:["FinCEN to freeze accounts","Registered institutions to share information about possible laundering with each other","Customers to see SARs","Banks to skip CIP"],a:1,e:"314(b) gives legal protection for voluntary information sharing between registered institutions."},
{l:"m2c",q:"A customer matches a 314(a) list. What should follow?",o:["Tell the customer","Report the match as instructed and review the customer’s activity under procedure","Close the account at once","Ignore it"],a:1,e:"A match is not proof, but it warrants review."},
{l:"m3a",q:"Which is NOT a minimum identification element for an individual?",o:["Name","Date of birth","Employer","Identification number"],a:2,e:"The minimum is name, date of birth, address and an identification number."},
{l:"m3a",q:"Verifying that a company is registered tells you:",o:["Who owns it","That it legally exists, not who owns or controls it","That it is low risk","That it is not sanctioned"],a:1,e:"Existence, ownership and control are separate questions."},
{l:"m3b",q:"Under the ownership prong, a beneficial owner holds:",o:["10% or more","25% or more","50% or more","Any shares"],a:1,e:"Each 25%+ owner, plus one person with significant control."},
{l:"m3b",q:"What did FinCEN’s 13 February 2026 exceptive relief order allow?",o:["Ending beneficial ownership rules","Verifying beneficial owners at first account opening and as risk requires, rather than at every new account","Raising the threshold to 50%","Skipping CIP for businesses"],a:1,e:"The relief is optional; the requirement itself remains."},
{l:"m3b",q:"A public registry shows no owner for a company. What can you conclude?",o:["It has no owners","Nothing on its own; it is a gap to close","It is a shell","It is sanctioned"],a:1,e:"Missing public data is not evidence of no ownership."},
{l:"m3c",q:"Why does a specific customer profile matter for monitoring?",o:["It sets prices","It defines normal activity so deviations can be judged","It replaces screening","It is only for audit"],a:1,e:"Monitoring compares actual activity with the profile."},
{l:"m3c",q:"Which event should normally prompt a risk rating review?",o:["The customer changes their PIN","Adverse news about the customer","A routine card purchase","A branch renovation"],a:1,e:"Trigger events include adverse media, new products, new countries and repeated alerts."},
{l:"m3d",q:"What is the difference between source of funds and source of wealth?",o:["They are the same","Source of funds is where a specific amount came from; source of wealth is how overall wealth was built","Source of wealth is only for companies","Source of funds applies only to cash"],a:1,e:"Both are typical EDD questions."},
{l:"m3d",q:"Which customer type typically calls for EDD?",o:["A salaried employee with payroll deposits","A money services business","A student with a small allowance","A retiree with a pension"],a:1,e:"MSBs, PEPs, cash-intensive businesses and complex structures are typical EDD categories."},
{l:"m4a",q:"Under the OFAC 50 Percent Rule, two blocked persons own 30% each of a company. The company is:",o:["Not affected, as neither owns 50%","Treated as blocked because aggregate ownership is 60%","Only restricted for exports","On the grey list"],a:1,e:"Ownership by blocked persons is aggregated."},
{l:"m4a",q:"Sanctions liability is described as strict. What does that mean?",o:["Only intentional violations count","Violations can occur without intent","Only large banks are liable","It applies only abroad"],a:1,e:"That is why real-time screening matters."},
{l:"m4a",q:"Blocked property must generally be reported to OFAC within:",o:["24 hours","10 business days","30 days","90 days"],a:1,e:"Blocking reports are due within 10 business days."},
{l:"m4b",q:"A screening hit shares a common name but has a different date of birth and country. What next?",o:["Block the account","Document the mismatch and resolve it as a false positive under procedure","Ask the customer if they are sanctioned","File a SAR"],a:1,e:"Compare identifiers and document the basis; never ask the customer."},
{l:"m4b",q:"A payment hit cannot be ruled out. What should happen?",o:["Release it to avoid delays","Escalate and hold under procedure","Delete the alert","Ask the beneficiary"],a:1,e:"Unresolved potential matches are escalated before release."},
{l:"m4c",q:"Which statement about PEPs is correct?",o:["PEPs must be exited","PEP status raises corruption risk and calls for proportionate due diligence","PEPs are exempt from monitoring","Only foreign officials count"],a:1,e:"PEP status is a risk factor, not evidence of wrongdoing."},
{l:"m4c",q:"News reports that a customer was charged but later acquitted. How should this be recorded?",o:["As a conviction","Accurately, noting the acquittal","Ignored","As proof of fraud"],a:1,e:"Status matters: allegation, charge, conviction and acquittal are different facts."},
{l:"m4d",q:"What does it mean for a country to be on the FATF grey list?",o:["All transactions must be rejected","It is under increased monitoring while it fixes deficiencies","It is sanctioned by OFAC","It has no AML laws"],a:1,e:"Grey listing does not mean automatic rejection."},
{l:"m4d",q:"As of the 30 October 2026 FATF plenary, which jurisdictions are subject to a call for action?",o:["DPRK, Iran and Myanmar","Monaco and Bulgaria","All EU states","None"],a:0,e:"Always check the current list before citing it."},
{l:"m5a",q:"Why does data quality matter so much in monitoring?",o:["It affects colours on dashboards","Missing or mislabelled fields can silently stop scenarios from working","It does not matter","It only affects reports"],a:1,e:"Detection logic is only as good as the data it runs on."},
{l:"m5a",q:"What is a behavioural model in monitoring?",o:["A fixed dollar threshold","Logic comparing a customer with their own history or peers","A sanctions list","A customer survey"],a:1,e:"Most programs combine rules and behavioural models."},
{l:"m5b",q:"Why do banks segment customers when setting thresholds?",o:["To reduce staff","Because normal activity differs widely between customer types","To avoid CTRs","To meet marketing goals"],a:1,e:"Segmentation applies sensible thresholds per group."},
{l:"m5b",q:"How do monitoring programs handle the fact that no single scenario catches everything?",o:["They ignore gaps","Overlapping scenarios cover each other’s gaps","They file more CTRs","They stop monitoring"],a:1,e:"Coverage comes from layered scenarios."},
{l:"m5c",q:"What is below-the-line testing?",o:["Reviewing closed SARs","Sampling activity just under a threshold to see what would be missed","Testing analysts’ typing speed","Checking sanctions lists"],a:1,e:"It informs whether thresholds can be raised safely."},
{l:"m5c",q:"Raising a scenario threshold usually:",o:["Improves precision and may reduce detection","Increases alerts","Has no effect","Removes all false positives"],a:0,e:"That trade-off is the heart of tuning."},
{l:"m5c",q:"Why does model risk management apply to monitoring systems?",o:["They are marketing tools","They are models whose design and performance need validation","Regulators require colour coding","They replace analysts"],a:1,e:"Design, validation, performance review and change control all apply."},
{l:"m5d",q:"Why are ageing alerts a concern?",o:["They slow the computer","They can delay SAR filing past deadlines","They improve quality","They are never a concern"],a:1,e:"Service levels protect filing timelines."},
{l:"m5d",q:"What does good analyst productivity mean?",o:["Closing the most alerts","Consistent, well-evidenced decisions","Escalating everything","Skipping narratives"],a:1,e:"Quality outweighs volume."},
{l:"m6a",q:"Several unrelated people deposit $4,000 each into one account on the same day. This is:",o:["Integration","Smurfing","A CD rollover","Payroll"],a:1,e:"Smurfing uses multiple people to place cash below thresholds."},
{l:"m6a",q:"Cash goes in at branches in one region and comes out quickly in another. This typology is a:",o:["Funnel account","Dormant account","Payroll account","Trust account"],a:0,e:"Funnel accounts move value between regions."},
{l:"m6a",q:"A salon’s cash deposits are triple its stated revenue, though KYC says most sales are card. This may indicate:",o:["Commingling","Normal growth","A CTR exemption","Interest income"],a:0,e:"Illicit cash mixed into business revenue."},
{l:"m6b",q:"A new company with no payroll or rent moves large round sums in and out within a day. This suggests:",o:["A payroll bureau","Shell or pass-through activity","A savings account","Normal trade"],a:1,e:"No operating footprint and rapid movement are classic shell indicators."},
{l:"m6b",q:"Why is dormant account reactivation a red flag?",o:["Dormant accounts pay interest","Quiet accounts are often sold or recruited for laundering","It breaks the system","It is never a red flag"],a:1,e:"Unless explained, sudden large activity on a dormant account warrants review."},
{l:"m6c",q:"Which pattern best fits a money mule?",o:["Steady salary and bills","Many unrelated senders followed by rapid cash withdrawals or onward transfers","One annual bonus","Monthly rent payments"],a:1,e:"Mules receive and pass on funds for others."},
{l:"m6c",q:"How should a narrative treat a possibly unwitting mule?",o:["State they are a criminal","Record facts and leave intent to investigators","Omit them","Contact them to warn them"],a:1,e:"Mules may be victims too; stick to facts."},
{l:"m6d",q:"Which is a trade-based laundering indicator visible in payments?",o:["Payroll on the 15th","Payments for goods that do not match the customer’s business","Utility bills","Card purchases"],a:1,e:"Goods, prices and counterparties should make commercial sense."},
{l:"m6d",q:"What documents can help test a suspected TBML payment?",o:["Payslips","Invoices, bills of lading or contracts","Credit scores","Marketing brochures"],a:1,e:"Check that names and amounts reconcile."},
{l:"m6e",q:"An older customer suddenly wires savings to a new overseas ‘friend’ met online. This may indicate:",o:["Normal investing","Elder financial exploitation or a romance scam","A CTR","Structuring"],a:1,e:"FinCEN’s 2022 advisory lists such red flags."},
{l:"m6e",q:"Which key term does FinCEN ask filers to use for elder financial exploitation SARs?",o:["EFE FIN-2022-A002","CTR-2022","OFAC-50","PEP-2022"],a:0,e:"Advisory key terms help FinCEN route and analyse filings."},
{l:"m6e",q:"A supplier emails urgently to change its bank details to a new overseas account. This is a common sign of:",o:["Business email compromise","Payroll","A CD maturity","Interest posting"],a:0,e:"BEC relies on urgent changes to beneficiary details."},
{l:"m6f",q:"How do banks usually see virtual asset activity?",o:["Directly on the blockchain","Through transfers to and from exchanges, kiosks and P2P sellers","They never see it","Only through CTRs"],a:1,e:"Banks see the fiat edges of crypto activity."},
{l:"m6f",q:"A customer is coached by a third party to buy crypto at a kiosk. What should the analyst consider?",o:["The customer may be a scam victim","It is always laundering","It is normal investing","Nothing"],a:0,e:"Many crypto alerts involve victims; note who directs the activity."},
{l:"m7a",q:"What should an analyst read first on a new alert?",o:["The largest amount","The scenario, triggering transactions and review period","The customer’s social media","Prior SAR narratives only"],a:1,e:"The scenario tells you which risk you are testing."},
{l:"m7a",q:"The file already documents a supported explanation for the alerted activity. What is the right step?",o:["Escalate anyway","Record the explanation and close","Ask the customer again","Delete the alert"],a:1,e:"Supported explanations allow a documented closure."},
{l:"m7b",q:"Which statement is strongest in an analysis?",o:["Activity increased a lot","Credits were 4.2 times the stated monthly income","The customer seems suspicious","Things look odd"],a:1,e:"Quantify the change."},
{l:"m7b",q:"Why look beyond the alerting transactions?",o:["To fill time","The rest of the account may show more important activity","Regulations forbid it","It is never useful"],a:1,e:"The trigger may be the least interesting part."},
{l:"m7c",q:"“The customer is moving criminal proceeds”, written with no supporting evidence, is:",o:["A fact","An observation","An assumption","A finding"],a:2,e:"Assumptions never belong in conclusions."},
{l:"m7c",q:"How should an RFI to a customer be worded?",o:["Mention the SAR review","Neutral and routine, with no hint of a SAR","Threatening closure","Accusatory"],a:1,e:"Avoid any risk of tipping off."},
{l:"m7c",q:"A customer emails an explanation with no documents. How should it be treated?",o:["As verified evidence","As information to test against the records","As irrelevant","As grounds to close"],a:1,e:"Note whether documents were provided and reconcile."},
{l:"m7d",q:"Which elements should a SAR narrative cover?",o:["Only the amount","Who, what, when, where, why and how, in chronological order","The analyst’s opinion of the customer","Internal system codes"],a:1,e:"Write for a reader who has never seen the account."},
{l:"m7d",q:"Which is a typical disposition option?",o:["Fine the customer","Escalate for SAR consideration","Publish the alert","Notify the customer of the SAR"],a:1,e:"Close, investigate further, or escalate for SAR consideration."},
{l:"m8a",q:"Which tool quickly totals transactions by counterparty?",o:["A PivotTable","Spell check","Page layout","Comments"],a:0,e:"PivotTables answer most grouping questions fast."},
{l:"m8a",q:"Which formula counts cash deposits between $8,000 and $9,999?",o:["SUM","COUNTIFS with two amount conditions and a type condition","VLOOKUP on its own","CONCAT"],a:1,e:"COUNTIFS applies multiple criteria."},
{l:"m8a",q:"You copy a formula containing $B$2 down a column. What happens to that reference?",o:["It changes to B3, B4…","It stays $B$2","It becomes an error","It becomes $B3"],a:1,e:"Absolute references do not move."},
{l:"m8a",q:"Which function pulls a customer’s risk rating from a KYC sheet into a transaction list by customer ID?",o:["XLOOKUP","ROUND","TRIM","NOW"],a:0,e:"XLOOKUP (or VLOOKUP/INDEX-MATCH) joins data on a shared key."},
{l:"m8a",q:"A SUM of an amount column looks too low. What is a likely cause?",o:["Some amounts are stored as text","The font is too small","The sheet is protected","Gridlines are hidden"],a:0,e:"Numbers stored as text are ignored by SUM; convert them before totalling."},
{l:"m8b",q:"Which search best narrows results for adverse news on a subject?",o:["The subject’s first name only","\"Full Name\" plus terms such as fraud OR indicted OR sanctions","A random keyword","The bank’s name"],a:1,e:"Exact-phrase names combined with risk terms cut noise."},
{l:"m3c",q:"A customer’s profile says ‘personal use’ with no expected values. Why is this a problem?",o:["It is not a problem","It gives no baseline, making alerts hard to resolve","It breaks screening","It forces a SAR"],a:1,e:"Specific, current profiles make deviations measurable."},
{l:"m4d",q:"A customer pays a supplier in a grey-list country with matching invoices and a long trade history. What is the right view?",o:["Reject the payment","Geography raises risk, but documented, consistent trade can be routine","File a SAR automatically","Block the account"],a:1,e:"Geography never decides a case alone."},
{l:"m5b",q:"A scenario flags 'three or more cash deposits of $8,000–$9,999 within seven days'. Which parameters does it use?",o:["Amount band, count and time window","Country and channel","Customer age","Interest rate"],a:0,e:"Amounts, counts and windows set a scenario’s sensitivity."},
{l:"m7d",q:"Why should closing notes be written as carefully as SAR narratives?",o:["They are sent to FinCEN","Reviewers, auditors or examiners may rely on them years later","They are published","They are not important"],a:1,e:"Defensible closures need clear, factual rationale."},
{l:"m8b",q:"Which is the most reliable OSINT source?",o:["An anonymous forum post","A state business registry","A social media comment","An undated blog"],a:1,e:"Start with official sources."},
{l:"m8b",q:"Which practice is required in OSINT research for a case?",o:["Contacting the subject","Recording searches, dates and results, including nothing found","Creating fake profiles","Keeping no notes"],a:1,e:"Research should be repeatable by another analyst."}
];

const GLOSS=[

["Below-the-line testing","Sampling activity just under a threshold to see what a scenario would miss."],
